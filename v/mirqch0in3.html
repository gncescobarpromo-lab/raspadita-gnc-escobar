<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>QR no disponible - GNC Escobar</title>
<style>
  :root { --ypf-blue: #003DA5; --ypf-gold: #C8973A; --light-bg: #f0f4ff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: var(--light-bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  .header { background: var(--ypf-blue); width: 100%; max-width: 420px; border-radius: 16px 16px 0 0; padding: 18px; text-align: center; }
  .header h1 { font-size: 1.6rem; color: var(--ypf-gold); letter-spacing: 1px; }
  .card { background: white; width: 100%; max-width: 420px; border-radius: 0 0 16px 16px; box-shadow: 0 8px 30px rgba(0,61,165,0.15); padding: 28px 24px; text-align: center; }
  .card h3 { color: var(--ypf-blue); font-size: 1.15rem; margin-bottom: 10px; }
  .card p { font-size: 0.9rem; color: #555; line-height: 1.5; }
</style>
</head>
<body>
<div class="header"><h1>GNC Escobar</h1></div>
<div class="card">
  <h3>Este QR no está disponible</h3>
  <p>Para participar del sorteo, pedí el QR a otro vendedor de la estación.</p>
</div>
</body>
</html>
